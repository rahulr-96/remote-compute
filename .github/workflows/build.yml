name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF client
        run: dotnet build src/RemoteCompute.Client/RemoteCompute.Client.csproj --configuration Release
